<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<script>
  /* ────────────────────────────────────────────────────────────────
     여기 한 줄만 바꾸면 됩니다.
     Apps Script에서 배포 → 새 배포 → 웹 앱 으로 나온 주소를 붙여 넣으세요.
     ──────────────────────────────────────────────────────────────── */
  var WEBAPP_URL = "";

  /* 화면을 그리기 전에 바로 넘긴다. replace 라서 뒤로 가기에 걸리지 않는다. */
  (function () {
    var u = (WEBAPP_URL || '').trim();
    if (/^https:\/\/script\.google\.com\/macros\/s\/[\w-]+\/(exec|dev)/.test(u)) location.replace(u);
  })();
</script>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>헤븐씨드 with 미션</title>
<meta name="description" content="2026 가을 친구초청잔치 with 미션 · 교사용 포인트 집계">
<meta name="theme-color" content="#F5A524">
<meta name="robots" content="noindex">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🌱</text></svg>">
<style>
  :root{--seed:#F5A524;--seed-dark:#D98510;--ink:#4A3B2C;--ink-soft:#8B7A66;--line:#F0E5D4}
  *{box-sizing:border-box}
  body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;
    font-family:'Pretendard','Apple SD Gothic Neo','Noto Sans KR',system-ui,sans-serif;color:var(--ink);
    background:linear-gradient(170deg,#FFF6E6 0%,#FFFDF7 38%,#F1FBF4 100%)}
  .box{background:#fff;border:1px solid var(--line);border-radius:24px;padding:34px 28px;max-width:400px;width:100%;
    text-align:center;box-shadow:0 10px 30px rgba(120,90,40,.10)}
  .seed{font-size:46px;display:block}
  h1{margin:10px 0 4px;font-size:22px;font-weight:800;letter-spacing:-.4px}
  p{margin:0;color:var(--ink-soft);font-size:13.5px;line-height:1.6}
  .go{display:inline-block;margin-top:22px;padding:14px 30px;border-radius:15px;text-decoration:none;font-weight:800;
    font-size:15px;color:#fff;background:linear-gradient(135deg,var(--seed),var(--seed-dark));
    box-shadow:0 6px 16px rgba(217,133,16,.32)}
  .warn{margin-top:20px;background:#FFF6E6;border:1px solid #F5DCAE;border-radius:14px;padding:14px;
    font-size:12.5px;color:#8A6119;text-align:left;line-height:1.7}
  code{background:#FFF1DC;padding:2px 6px;border-radius:6px;font-size:11.5px}
</style>
</head>
<body>
  <!-- 아래는 이동이 막혔을 때만 보입니다. 보통은 이 화면을 볼 일이 없습니다. -->
  <div class="box">
    <span class="seed">🌱</span>
    <h1>헤븐씨드 with 미션</h1>
    <p>2026 가을 친구초청잔치<br>교사용 포인트 집계</p>
    <div id="body"></div>
  </div>

<script>
(function () {
  var box = document.getElementById('body');
  var url = (WEBAPP_URL || '').trim();
  if (/^https:\/\/script\.google\.com\/macros\/s\/[\w-]+\/(exec|dev)/.test(url)) {
    // 이동이 이미 시작됐다. 혹시 막혔을 때를 위해 눌러서 갈 수 있는 링크만 둔다.
    box.innerHTML = '<a class="go" href="' + url + '">앱 열기</a>';
    return;
  }
  box.innerHTML =
    '<div class="warn"><b>아직 연결 전입니다.</b><br>' +
    'Apps Script에서 <b>배포 → 새 배포 → 웹 앱</b>으로 주소를 받은 뒤, ' +
    '이 저장소의 <code>index.html</code> 맨 위 <code>WEBAPP_URL</code>에 붙여 넣고 저장하세요.</div>';
})();
</script>
</body>
</html>
