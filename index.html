<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>헤븐씨드 with 미션</title>
<meta name="description" content="2026 가을 친구초청잔치 with 미션 · 교사용 포인트 집계">
<meta name="theme-color" content="#F5A524">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🌱</text></svg>">
<script>
  /* ────────────────────────────────────────────────────────────────
     여기 한 줄만 바꾸면 됩니다.
     Apps Script에서 배포 → 새 배포 → 웹 앱 으로 나온 주소를 붙여 넣으세요.
     (https://script.google.com/macros/s/ ... /exec 형태)
     ──────────────────────────────────────────────────────────────── */
  var WEBAPP_URL = "";
</script>
<style>
  :root{--seed:#F5A524;--seed-dark:#D98510;--ink:#4A3B2C;--ink-soft:#8B7A66;--line:#F0E5D4}
  *{box-sizing:border-box}
  body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;
    font-family:'Pretendard','Apple SD Gothic Neo','Noto Sans KR',system-ui,sans-serif;color:var(--ink);
    background:linear-gradient(170deg,#FFF6E6 0%,#FFFDF7 38%,#F1FBF4 100%)}
  .box{background:#fff;border:1px solid var(--line);border-radius:24px;padding:34px 28px;max-width:400px;width:100%;
    text-align:center;box-shadow:0 10px 30px rgba(120,90,40,.10)}
  .seed{font-size:46px;display:block;animation:bob 2.6s ease-in-out infinite}
  @keyframes bob{0%,100%{transform:translateY(0) rotate(-4deg)}50%{transform:translateY(-7px) rotate(4deg)}}
  h1{margin:10px 0 4px;font-size:22px;font-weight:800;letter-spacing:-.4px}
  p{margin:0;color:var(--ink-soft);font-size:13.5px;line-height:1.6}
  .go{display:inline-block;margin-top:22px;padding:14px 30px;border-radius:15px;text-decoration:none;font-weight:800;
    font-size:15px;color:#fff;background:linear-gradient(135deg,var(--seed),var(--seed-dark));
    box-shadow:0 6px 16px rgba(217,133,16,.32)}
  .go:active{transform:translateY(1px)}
  .note{margin-top:18px;font-size:11.5px;color:var(--ink-soft)}
  .warn{margin-top:20px;background:#FFF6E6;border:1px solid #F5DCAE;border-radius:14px;padding:14px;
    font-size:12.5px;color:#8A6119;text-align:left;line-height:1.7}
  code{background:#FFF1DC;padding:2px 6px;border-radius:6px;font-size:11.5px}
  .dots i{display:inline-block;width:6px;height:6px;margin:0 3px;border-radius:50%;background:var(--seed);
    animation:pulse 1.2s ease-in-out infinite}
  .dots i:nth-child(2){animation-delay:.2s}.dots i:nth-child(3){animation-delay:.4s}
  @keyframes pulse{0%,100%{opacity:.25;transform:scale(.8)}50%{opacity:1;transform:scale(1)}}
</style>
</head>
<body>
  <div class="box">
    <span class="seed">🌱</span>
    <h1>헤븐씨드 with 미션</h1>
    <p>2026 가을 친구초청잔치<br>교사용 포인트 집계</p>
    <div id="body"></div>
  </div>

<script>
(function () {
  var box = document.getElementById('body');
  var url = (WEBAPP_URL || '').trim();
  var ok = /^https:\/\/script\.google\.com\/macros\/s\/[\w-]+\/(exec|dev)/.test(url);

  if (!ok) {
    box.innerHTML =
      '<div class="warn"><b>아직 연결 전입니다.</b><br>' +
      'Apps Script에서 <b>배포 → 새 배포 → 웹 앱</b>으로 주소를 받은 뒤, ' +
      '이 저장소의 <code>index.html</code> 맨 위 <code>WEBAPP_URL</code>에 붙여 넣고 저장하세요. ' +
      '1~2분 뒤 이 주소가 바로 앱으로 넘어갑니다.</div>';
    return;
  }

  box.innerHTML =
    '<a class="go" href="' + url + '">앱 열기</a>' +
    '<div class="note"><span class="dots"><i></i><i></i><i></i></span><br>잠시 뒤 자동으로 넘어갑니다.<br>' +
    '휴대폰에서는 이 주소를 홈 화면에 추가해 두시면 편합니다.</div>';

  setTimeout(function () { location.replace(url); }, 1200);
})();
</script>
</body>
</html>
